<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GRI CONNECT SYS</title>

    <!-- Ícone do navegador -->
    <link rel="icon" href="assets/favicon.png">

    <!-- Ícone para iPhone/iPad -->
    <link rel="apple-touch-icon" href="assets/icon-180.png">

    <!-- Nome do aplicativo -->
    <meta name="apple-mobile-web-app-title"
          content="GRI CONNECT">

    <!-- Abre em modo aplicativo -->
    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <!-- Barra superior -->
    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <!-- Cor do navegador -->
    <meta name="theme-color"
          content="#1565C0">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">

                <img
                    id="logoGRI"
                    src="assets/logo.png"
                    alt="GRI SYS">

            </div>

            <h1>GRI CONNECT SYS</h1>

            <h2>Consulta Inteligente de Inspeções</h2>

            <form id="loginForm">

                <div class="grupo">

                    <label>Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        autocomplete="username"
                        autofocus>

                </div>

                <div class="grupo">

                    <label>Senha</label>

                    <input
                        type="password"
                        id="senha"
                        autocomplete="current-password">

                </div>

                <button
                    id="btnEntrar"
                    type="submit">

                    ENTRAR

                </button>

            </form>

            <div
                id="loading"
                class="loading oculto">

                <img
                    id="logoAnimada"
                    src="assets/logo.png"
                    alt="Logo">

                <h3>Conectando ao GRI CONNECT SYS</h3>

                <p>

                    Preparando seu ambiente de consulta...

                </p>

            </div>

            <div class="rodape">

                <span>

                    Portal sincronizado em

                </span>

                <strong id="dataSync">

                    --/--/----

                </strong>

                <strong id="horaSync">

                    --:--

                </strong>

                <span class="versao">

                    Versão 1.0.0

                </span>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
