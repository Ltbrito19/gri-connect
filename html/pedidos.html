<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GRI CONNECT SYS - Pedidos</title>

    <link rel="stylesheet" href="../css/pedidos.css">

</head>

<body>

<div class="container">

    <header class="topo">

        <button
            class="voltar"
            onclick="history.back()">

            ← Voltar

        </button>

        <h1>

            PEDIDOS

        </h1>

    </header>


    <section class="pesquisa">

        <input
            id="txtPesquisa"
            type="text"
            placeholder="Pedido, cidade, inspetor ou companhia">

        <button
            id="btnPesquisar">

            PESQUISAR

        </button>

    </section>


    <!-- ==========================================
         RESUMO / FILTROS POR STATUS
    =========================================== -->

    <section class="resumo">

        <div
            class="item verde filtro-status"
            data-status="Agendado">

            <span>🟢 Agendados</span>

            <strong id="qtAgendados">0</strong>

        </div>


        <div
            class="item amarelo filtro-status"
            data-status="Em Andamento">

            <span>🟡 Em andamento</span>

            <strong id="qtEmAndamento">0</strong>

        </div>


        <div
            class="item filtro-status"
            data-status="Pendente">

            <span>🔵 Pendentes</span>

            <strong id="qtPendentes">0</strong>

        </div>


        <div
            class="item filtro-status"
            data-status="Comunicado Sys">

            <span>🟣 Comunicado Sys</span>

            <strong id="qtComunicadoSys">0</strong>

        </div>


        <div
            class="item filtro-status"
            data-status="Pendente Cia">

            <span>🟠 Pendente Cia</span>

            <strong id="qtPendenteCia">0</strong>

        </div>


        <div
            class="item filtro-status"
            data-status="Pendente Km">

            <span>🔴 Pendente Km</span>

            <strong id="qtPendenteKm">0</strong>

        </div>


        <div
            class="item filtro-status"
            data-status="TODOS">

            <span>📋 Todos os ativos</span>

            <strong id="qtTodos">0</strong>

        </div>

    </section>


    <!-- ==========================================
         LISTA DE PEDIDOS
    =========================================== -->

    <section
        id="listaPedidos">

    </section>

</div>


<!-- ===========================================
     MODAL
============================================ -->

<div
    id="modalPedido"
    class="modal">

    <div class="modal-conteudo">

        <div class="modal-topo">

            <h2>Pedido</h2>

            <button
                id="btnFecharModal"
                class="fechar">

                ✕

            </button>

        </div>

        <h1 id="modalNumero"></h1>

        <div
            id="modalStatus"
            class="status">

        </div>

        <div class="linha">

            <span>Recebido</span>

            <strong id="modalRecebido"></strong>

        </div>

        <div class="linha">

            <span>Dias em aberto</span>

            <strong id="modalDias"></strong>

        </div>

        <div class="linha">

            <span>Companhia</span>

            <strong id="modalCompanhia"></strong>

        </div>

        <div class="linha">

            <span>Produto</span>

            <strong id="modalProduto"></strong>

        </div>

        <div class="linha">

            <span>Cidade / Bairro</span>

            <strong id="modalCidade"></strong>

        </div>

        <div class="linha">

            <span>Inspetor</span>

            <strong id="modalInspetor"></strong>

        </div>

        <div class="linha">

            <span>Agendamento</span>

            <strong id="modalAgendamento"></strong>

        </div>

        <button
            id="btnWhatsapp"
            class="acao">

            💬 COBRAR

        </button>

    </div>

</div>


<script src="../js/pedidos.js?v=20260817"></script>

</body>

</html>
